name: "Release"

on:
  push:
    branches: [main]
    paths:
      - '.changeset/*.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

# Concurrency control: only one release process can run at a time
# This prevents race conditions if multiple releasable change intents merge simultaneously
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-changesets:
    name: Check for change intents
    runs-on: ubuntu-latest
    outputs:
      has-changesets: ${{ steps.check.outputs.has-changesets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: 11.13.1
          runtime: node@24
          install: false

      - name: Check for change intents
        id: check
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: bash scripts/check-release-changes.sh posthog-php

      - name: Send failure event to PostHog
        if: ${{ failure() }}
        continue-on-error: true
        uses: PostHog/posthog-github-action@9a6a19d360820ab4d95ecc4a5a7564062c895f84 # v1.3.0
        with:
          posthog-token: "${{ secrets.POSTHOG_PROJECT_API_KEY }}"
          event: "posthog-sdk-github-release-workflow-failure"
          properties: >-
            {
              "commitSha": "${{ github.sha }}",
              "jobStatus": "${{ job.status }}",
              "ref": "${{ github.ref }}",
              "repository": "${{ github.repository }}",
              "sdk": "posthog-php",
              "jobName": "check-changesets",
              "packageName": "posthog-php",
              "packageVersion": "unknown",
              "actionUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "alertText": ":rotating_light: posthog-php release check failed :rotating_light:",
              "alertContext": "The change intent check failed before release candidate preparation, for example because main moved while releasable intents were still pending."
            }

  prepare-release-candidate:
    name: Prepare release candidate
    needs: check-changesets
    runs-on: ubuntu-latest
    if: needs.check-changesets.outputs.has-changesets == 'true'
    permissions:
      contents: read
    outputs:
      new-version: ${{ steps.candidate.outputs.new-version }}
      patch-sha256: ${{ steps.candidate.outputs.patch-sha256 }}
      source-sha: ${{ steps.candidate.outputs.source-sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          # Native release management requires pnpm >=11.13.0.
          version: 11.13.1
          runtime: node@24
          cache: true
          install: false

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.4
          tools: composer

      - name: Apply change intents and update version
        id: candidate
        env:
          # If scripts/bump-version.sh changes, recompute this with:
          # sha256sum scripts/bump-version.sh
          # Then update EXPECTED_BUMP_SCRIPT_SHA256 in this workflow in the same PR.
          EXPECTED_BUMP_SCRIPT_SHA256: fb70c4da11c73df4da1b5b8d3cbd7e483cd19525dc9d8045f6c53a1bd1546809
        run: |
          set -euo pipefail

          source_sha=$(git rev-parse HEAD)
          pnpm --filter posthog-php version -r
          git add --intent-to-add .changeset/ledger.yaml
          new_version=$(node -p "require('./package.json').version")

          actual_bump_script_sha256=$(sha256sum scripts/bump-version.sh | awk '{print $1}')
          if [ "$actual_bump_script_sha256" != "$EXPECTED_BUMP_SCRIPT_SHA256" ]; then
            echo "scripts/bump-version.sh sha256 mismatch: expected $EXPECTED_BUMP_SCRIPT_SHA256, got $actual_bump_script_sha256" >&2
            exit 1
          fi

          ./scripts/bump-version.sh "$new_version"
          composer update --lock --no-install --no-interaction --no-audit

          if [ -z "$(git status --porcelain)" ]; then
            echo "No release candidate changes were generated" >&2
            exit 1
          fi

          changed_files=$(git diff --name-only)
          while IFS= read -r file; do
            case "$file" in
              CHANGELOG.md|composer.json|composer.lock|package.json|lib/PostHog.php|.changeset/*) ;;
              *)
                echo "Unexpected release candidate change: $file" >&2
                exit 1
                ;;
            esac
          done <<< "$changed_files"

          composer_version=$(perl -0ne 'print $1 if /"version"\s*:\s*"([^"]+)"/' composer.json)
          php_version=$(perl -0ne "print \$1 if /public const VERSION = '([^']+)'/" lib/PostHog.php)
          if [ "$new_version" != "$composer_version" ] || [ "$new_version" != "$php_version" ]; then
            echo "Version mismatch: package.json=$new_version composer.json=$composer_version lib/PostHog.php=$php_version" >&2
            exit 1
          fi

          git diff --binary > release.patch
          patch_sha256=$(sha256sum release.patch | awk '{print $1}')

          {
            echo "source-sha=$source_sha"
            echo "new-version=$new_version"
            echo "patch-sha256=$patch_sha256"
          } >> "$GITHUB_OUTPUT"
          echo "Release candidate $new_version prepared from $source_sha with patch sha256 $patch_sha256"

      - name: Upload release candidate patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ steps.candidate.outputs.source-sha }}
          path: release.patch
          if-no-files-found: error
          retention-days: 5

      - name: Send failure event to PostHog
        if: ${{ failure() }}
        continue-on-error: true
        uses: PostHog/posthog-github-action@9a6a19d360820ab4d95ecc4a5a7564062c895f84 # v1.3.0
        with:
          posthog-token: "${{ secrets.POSTHOG_PROJECT_API_KEY }}"
          event: "posthog-sdk-github-release-workflow-failure"
          properties: >-
            {
              "commitSha": "${{ github.sha }}",
              "jobStatus": "${{ job.status }}",
              "ref": "${{ github.ref }}",
              "repository": "${{ github.repository }}",
              "sdk": "posthog-php",
              "jobName": "prepare-release-candidate",
              "packageName": "posthog-php",
              "packageVersion": "${{ steps.candidate.outputs.new-version || 'unknown' }}",
              "actionUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "alertText": ":rotating_light: Failed to prepare release candidate posthog-php@${{ steps.candidate.outputs.new-version }} :rotating_light:",
              "alertContext": "The release candidate preparation step failed before approval or publish."
            }


  verify-release-candidate:
    name: Verify release candidate
    needs: [check-changesets, prepare-release-candidate]
    runs-on: ubuntu-latest
    if: needs.check-changesets.outputs.has-changesets == 'true'
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release-candidate.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download release candidate patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ needs.prepare-release-candidate.outputs.source-sha }}
          path: release-candidate

      - name: Apply and validate release candidate patch
        env:
          EXPECTED_VERSION: ${{ needs.prepare-release-candidate.outputs.new-version }}
        run: |
          set -euo pipefail

          git apply --index release-candidate/release.patch

          package_version=$(perl -0ne 'print $1 if /"version"\s*:\s*"([^"]+)"/' package.json)
          composer_version=$(perl -0ne 'print $1 if /"version"\s*:\s*"([^"]+)"/' composer.json)
          php_version=$(perl -0ne "print \$1 if /public const VERSION = '([^']+)'/" lib/PostHog.php)
          if [ "$EXPECTED_VERSION" != "$package_version" ] || [ "$EXPECTED_VERSION" != "$composer_version" ] || [ "$EXPECTED_VERSION" != "$php_version" ]; then
            echo "Version mismatch: expected=$EXPECTED_VERSION package.json=$package_version composer.json=$composer_version lib/PostHog.php=$php_version" >&2
            exit 1
          fi

      - name: Check tag and release do not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ needs.prepare-release-candidate.outputs.new-version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          check_missing() {
            local description="$1"
            shift
            local output
            local status

            if output=$("$@" 2>&1); then
              echo "$description already exists for $EXPECTED_VERSION" >&2
              exit 1
            else
              status=$?
            fi

            if grep -q "HTTP 404" <<< "$output" || grep -q "Not Found" <<< "$output"; then
              return 0
            fi

            echo "Could not check whether $description exists: $output" >&2
            exit "$status"
          }

          check_missing "GitHub release" gh api "repos/$REPOSITORY/releases/tags/$EXPECTED_VERSION"
          check_missing "git tag" gh api "repos/$REPOSITORY/git/ref/tags/$EXPECTED_VERSION"

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.4
          tools: composer

      - name: Validate composer files
        run: composer validate --no-check-version --strict

      - name: Send failure event to PostHog
        if: ${{ failure() }}
        continue-on-error: true
        uses: PostHog/posthog-github-action@9a6a19d360820ab4d95ecc4a5a7564062c895f84 # v1.3.0
        with:
          posthog-token: "${{ secrets.POSTHOG_PROJECT_API_KEY }}"
          event: "posthog-sdk-github-release-workflow-failure"
          properties: >-
            {
              "commitSha": "${{ github.sha }}",
              "jobStatus": "${{ job.status }}",
              "ref": "${{ github.ref }}",
              "repository": "${{ github.repository }}",
              "sdk": "posthog-php",
              "jobName": "verify-release-candidate",
              "packageName": "posthog-php",
              "packageVersion": "${{ needs.prepare-release-candidate.outputs.new-version || 'unknown' }}",
              "actionUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "alertText": ":rotating_light: Failed to verify release candidate posthog-php@${{ needs.prepare-release-candidate.outputs.new-version }} :rotating_light:",
              "alertContext": "The release candidate verification step failed before approval or publish."
            }


  notify-approval-needed:
    name: Notify Slack - Approval Needed
    needs: [check-changesets, prepare-release-candidate, verify-release-candidate]
    if: needs.check-changesets.outputs.has-changesets == 'true' && needs.prepare-release-candidate.result == 'success' && needs.verify-release-candidate.result == 'success'
    uses: posthog/.github/.github/workflows/notify-approval-needed.yml@5ba5d24966f2c416ca792654638e4ce6f19f545b # main
    with:
      slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
      slack_user_group_id: ${{ vars.GROUP_CLIENT_LIBRARIES_SLACK_GROUP_ID }}
      checkout_repository: false
      tag_pattern: "[0-9]*"
      tag_sort: version
    secrets:
      slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
      posthog_project_api_key: ${{ secrets.POSTHOG_PROJECT_API_KEY }}

  release:
    name: Publish PHP release
    outputs:
      commit-hash: ${{ steps.commit-version-bump.outputs.commit-hash }}
    needs: [check-changesets, prepare-release-candidate, verify-release-candidate, notify-approval-needed]
    runs-on: ubuntu-latest
    if: always() && needs.check-changesets.outputs.has-changesets == 'true' && needs.verify-release-candidate.result == 'success' && needs.notify-approval-needed.result == 'success'
    environment: "Release"
    permissions:
      actions: read
      contents: read
    steps:
      - name: Notify Slack - Approved
        if: needs.notify-approval-needed.outputs.slack_ts != ''
        uses: posthog/.github/.github/actions/slack-thread-reply@cb0979b67dcd585828b61ac45927eef4da8f6287 # main
        with:
          slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
          slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
          thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
          message: "✅ Release approved! Publishing release..."
          emoji_reaction: "white_check_mark"

      - name: Checkout approved source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release-candidate.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified release candidate patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ needs.prepare-release-candidate.outputs.source-sha }}
          path: release-candidate

      - name: Apply verified release candidate patch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PATCH_SHA256: ${{ needs.prepare-release-candidate.outputs.patch-sha256 }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare-release-candidate.outputs.source-sha }}
          EXPECTED_VERSION: ${{ needs.prepare-release-candidate.outputs.new-version }}
        run: |
          set -euo pipefail

          current_main_sha=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_main_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "main moved since the release candidate was prepared: expected $EXPECTED_SOURCE_SHA, got $current_main_sha" >&2
            exit 1
          fi

          actual_patch_sha256=$(sha256sum release-candidate/release.patch | awk '{print $1}')
          if [ "$actual_patch_sha256" != "$EXPECTED_PATCH_SHA256" ]; then
            echo "Release candidate patch sha256 mismatch: expected $EXPECTED_PATCH_SHA256, got $actual_patch_sha256" >&2
            exit 1
          fi

          git apply --index release-candidate/release.patch

          package_version=$(perl -0ne 'print $1 if /"version"\s*:\s*"([^"]+)"/' package.json)
          composer_version=$(perl -0ne 'print $1 if /"version"\s*:\s*"([^"]+)"/' composer.json)
          php_version=$(perl -0ne "print \$1 if /public const VERSION = '([^']+)'/" lib/PostHog.php)
          if [ "$EXPECTED_VERSION" != "$package_version" ] || [ "$EXPECTED_VERSION" != "$composer_version" ] || [ "$EXPECTED_VERSION" != "$php_version" ]; then
            echo "Version mismatch: expected=$EXPECTED_VERSION package.json=$package_version composer.json=$composer_version lib/PostHog.php=$php_version" >&2
            exit 1
          fi

          rm -rf release-candidate

      - name: Get GitHub App token
        id: releaser
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.GH_APP_POSTHOG_PHP_RELEASER_APP_ID }}
          private-key: ${{ secrets.GH_APP_POSTHOG_PHP_RELEASER_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit version bump
        id: commit-version-bump
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: "chore: release ${{ needs.prepare-release-candidate.outputs.new-version }} [version bump] [skip ci]"
          repo: ${{ github.repository }}
          branch: main
          file_pattern: "CHANGELOG.md composer.json composer.lock package.json lib/PostHog.php .changeset"
        env:
          GITHUB_TOKEN: ${{ steps.releaser.outputs.token }}

      - name: Require release commit
        env:
          COMMIT_SHA: ${{ steps.commit-version-bump.outputs.commit-hash }}
        run: |
          if [ -z "$COMMIT_SHA" ]; then
            echo "Release commit was not created" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.releaser.outputs.token }}
          NEW_VERSION: ${{ needs.prepare-release-candidate.outputs.new-version }}
          COMMIT_SHA: ${{ steps.commit-version-bump.outputs.commit-hash }}
        run: |
          CHANGELOG_ENTRY=$(awk -v defText="see CHANGELOG.md" '/^## /{if (flag) exit; flag=1} flag && /^##$/{exit} flag; END{if (!flag) print defText}' CHANGELOG.md)
          gh release create "$NEW_VERSION" --target "$COMMIT_SHA" --title "$NEW_VERSION" --notes "$CHANGELOG_ENTRY"

  notify-released:
    name: Notify Slack - Released
    needs: [notify-approval-needed, release]
    runs-on: ubuntu-latest
    if: always() && needs.release.result == 'success' && needs.notify-approval-needed.outputs.slack_ts != ''
    steps:
      - name: Notify Slack - Released
        uses: posthog/.github/.github/actions/slack-thread-reply@cb0979b67dcd585828b61ac45927eef4da8f6287 # main
        with:
          slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
          slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
          thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
          message: "🚀 posthog-php released successfully!"
          emoji_reaction: "rocket"

  notify-release-failed:
    name: Notify Slack/PostHog - Release Failed
    needs: [prepare-release-candidate, notify-approval-needed, release]
    runs-on: ubuntu-latest
    if: always() && (needs.release.result == 'failure' || needs.release.result == 'cancelled') && needs.notify-approval-needed.outputs.slack_ts != ''
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check whether release was rejected
        id: check-failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESPONSE=$(gh api /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/approvals)
          REJECTED=$(echo "$RESPONSE" | jq '[.[] | select(.state == "rejected")] | length')
          if [ "$REJECTED" -gt 0 ]; then
            echo "was_rejected=true" >> "$GITHUB_OUTPUT"
            COMMENT=$(echo "$RESPONSE" | jq -r '.[] | select(.state == "rejected") | .comment // empty' | head -1)
            if [ -n "$COMMENT" ]; then
              {
                echo 'message<<EOF'
                echo "🚫 Release was rejected: $COMMENT"
                echo 'EOF'
              } >> "$GITHUB_OUTPUT"
            else
              echo "message=🚫 Release was rejected." >> "$GITHUB_OUTPUT"
            fi
          else
            echo "was_rejected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send failure event to PostHog
        if: steps.check-failure.outputs.was_rejected != 'true'
        continue-on-error: true
        uses: PostHog/posthog-github-action@9a6a19d360820ab4d95ecc4a5a7564062c895f84 # v1.3.0
        with:
          posthog-token: "${{ secrets.POSTHOG_PROJECT_API_KEY }}"
          event: "posthog-sdk-github-release-workflow-failure"
          properties: >-
            {
              "commitSha": "${{ github.sha }}",
              "jobStatus": "${{ needs.release.result }}",
              "ref": "${{ github.ref }}",
              "repository": "${{ github.repository }}",
              "sdk": "posthog-php",
              "jobName": "release",
              "packageName": "posthog-php",
              "packageVersion": "${{ needs.prepare-release-candidate.outputs.new-version || 'unknown' }}",
              "actionUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "alertText": ":rotating_light: Failed to release posthog-php@${{ needs.prepare-release-candidate.outputs.new-version }} :rotating_light:",
              "alertContext": "The release workflow failed before completion."
            }

      - name: Notify Slack - Failed
        if: steps.check-failure.outputs.was_rejected != 'true'
        uses: posthog/.github/.github/actions/slack-thread-reply@cb0979b67dcd585828b61ac45927eef4da8f6287 # main
        with:
          slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
          slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
          thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
          message: "❌ Release `posthog-php@${{ needs.prepare-release-candidate.outputs.new-version }}` failed or was cancelled! <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
          emoji_reaction: "x"

      - name: Notify Slack - Rejected
        if: steps.check-failure.outputs.was_rejected == 'true'
        continue-on-error: true
        uses: PostHog/.github/.github/actions/slack-thread-reply@cb0979b67dcd585828b61ac45927eef4da8f6287 # main
        with:
          slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
          slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
          thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
          message: '${{ steps.check-failure.outputs.message }}'
          emoji_reaction: 'no_entry_sign'

  laravel-check-changesets:
    name: Check for Laravel change intents
    needs: [check-changesets, release]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      needs.check-changesets.result == 'success' &&
      (needs.check-changesets.outputs.has-changesets != 'true' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.source.outputs.sha }}
      has-changesets: ${{ steps.check.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.commit-hash || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record immutable release source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: 11.13.1
          runtime: node@24
          install: false
      - name: Check for Laravel change intents
        id: check
        env:
          TRIGGER_SHA: ${{ needs.release.outputs.commit-hash || github.sha }}
        run: bash scripts/check-release-changes.sh posthog-laravel

  prepare-laravel-release:
    needs: laravel-check-changesets
    if: always() && !cancelled() && needs.laravel-check-changesets.result == 'success' && needs.laravel-check-changesets.outputs.has-changesets == 'true'
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.candidate.outputs.source }}
      version: ${{ steps.candidate.outputs.version }}
      patch-sha256: ${{ steps.candidate.outputs.patch_sha256 }}
      archive-sha256: ${{ steps.candidate.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.laravel-check-changesets.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require current main
        env:
          SOURCE: ${{ needs.laravel-check-changesets.outputs.source }}
        run: test "$(git rev-parse origin/main)" = "$SOURCE"
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: 11.13.1
          runtime: node@24
          install: false
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Prepare immutable candidate (no release credentials)
        id: candidate
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/laravel_release.py prepare --repository "$REPOSITORY" --output "$RUNNER_TEMP/candidate"
          python3 - "$RUNNER_TEMP/candidate/candidate.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          for key, value in json.load(open(sys.argv[1])).items():
              print(f'{key}={value}')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laravel-candidate-${{ needs.laravel-check-changesets.outputs.source }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 5

  verify-laravel-release:
    needs: prepare-laravel-release
    if: always() && !cancelled() && needs.prepare-laravel-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-laravel-release.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: laravel-candidate-${{ needs.prepare-laravel-release.outputs.source }}
          path: ${{ runner.temp }}/candidate
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: 11.13.1
          runtime: node@24
          install: false
      - name: Independently reproduce candidate bytes
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/laravel_release.py prepare --repository "$REPOSITORY" --output "$RUNNER_TEMP/reproduced"
          for file in candidate.json release.patch package.tar.gz notes.md; do
            cmp "$RUNNER_TEMP/candidate/$file" "$RUNNER_TEMP/reproduced/$file"
          done
          git apply --check "$RUNNER_TEMP/candidate/release.patch"
      - name: Check source and distribution release refs are unused
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          DISTRIBUTION_REPOSITORY: ${{ vars.LARAVEL_DISTRIBUTION_REPOSITORY }}
          VERSION: ${{ needs.prepare-laravel-release.outputs.version }}
        run: bash scripts/check-laravel-release-refs.sh
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          extensions: curl, mbstring, dom, xml, sqlite3, pdo_sqlite
          tools: composer
      - name: Test approved source on both supported frameworks
        run: |
          bash scripts/test-laravel.sh 12
          bash scripts/test-laravel.sh 13
      - name: Validate distribution Composer metadata
        run: |
          mkdir "$RUNNER_TEMP/composer-check"
          tar -xzf "$RUNNER_TEMP/candidate/package.tar.gz" -C "$RUNNER_TEMP/composer-check"
          cd "$RUNNER_TEMP/composer-check"
          composer validate --strict --no-check-version
          composer install --no-dev --prefer-dist --no-progress --no-interaction --no-scripts --no-plugins

  publish-laravel:
    needs: [prepare-laravel-release, verify-laravel-release]
    if: always() && !cancelled() && needs.prepare-laravel-release.result == 'success' && needs.verify-laravel-release.result == 'success'
    runs-on: ubuntu-latest
    # Administrators MUST configure required reviewers and main-only deployment rules first.
    environment: Laravel Release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-laravel-release.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: laravel-candidate-${{ needs.prepare-laravel-release.outputs.source }}
          path: ${{ runner.temp }}/candidate
      - name: Recheck refs, main and approved candidate digests
        env:
          GH_TOKEN: ${{ secrets.LARAVEL_SOURCE_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          DISTRIBUTION_REPOSITORY: ${{ vars.LARAVEL_DISTRIBUTION_REPOSITORY }}
          VERSION: ${{ needs.prepare-laravel-release.outputs.version }}
          EXPECTED_SOURCE: ${{ needs.prepare-laravel-release.outputs.source }}
          EXPECTED_PATCH: ${{ needs.prepare-laravel-release.outputs.patch-sha256 }}
          EXPECTED_ARCHIVE: ${{ needs.prepare-laravel-release.outputs.archive-sha256 }}
          DISTRIBUTION_TOKEN: ${{ secrets.LARAVEL_DISTRIBUTION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" && test -n "$DISTRIBUTION_TOKEN"
          test "$(gh api "repos/$SOURCE_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_SOURCE"
          bash scripts/check-laravel-release-refs.sh
          echo "$EXPECTED_PATCH  $RUNNER_TEMP/candidate/release.patch" | sha256sum --check --strict
          echo "$EXPECTED_ARCHIVE  $RUNNER_TEMP/candidate/package.tar.gz" | sha256sum --check --strict
          git apply --index "$RUNNER_TEMP/candidate/release.patch"
      - name: Atomic GitHub-signed source version commit
        id: source-commit
        env:
          GH_TOKEN: ${{ secrets.LARAVEL_SOURCE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.prepare-laravel-release.outputs.version }}
        run: |
          python3 scripts/commit_laravel_release.py --checkout "$GITHUB_WORKSPACE" --repository "$REPOSITORY" --mode source --message "chore: release laravel-v$VERSION [skip ci]" >> "$GITHUB_OUTPUT"
      - name: Require signed source commit
        env:
          GH_TOKEN: ${{ secrets.LARAVEL_SOURCE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ steps.source-commit.outputs.commit-hash }}
        run: |
          test -n "$COMMIT"
          test "$(gh api "repos/$REPOSITORY/commits/$COMMIT" --jq '.commit.verification.verified')" = true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.LARAVEL_DISTRIBUTION_REPOSITORY }}
          ref: main
          path: laravel-distribution
          token: ${{ secrets.LARAVEL_DISTRIBUTION_TOKEN }}
          persist-credentials: false
      - name: Replace dedicated distribution tree with package-only files
        env:
          REPOSITORY: ${{ vars.LARAVEL_DISTRIBUTION_REPOSITORY }}
        run: python3 scripts/laravel_release.py install --candidate "$RUNNER_TEMP/candidate" --destination "$GITHUB_WORKSPACE/laravel-distribution" --repository "$REPOSITORY"
      - name: Atomic GitHub-signed distribution commit
        id: distribution-commit
        env:
          GH_TOKEN: ${{ secrets.LARAVEL_DISTRIBUTION_TOKEN }}
          REPOSITORY: ${{ vars.LARAVEL_DISTRIBUTION_REPOSITORY }}
          VERSION: ${{ needs.prepare-laravel-release.outputs.version }}
          SOURCE: ${{ needs.prepare-laravel-release.outputs.source }}
        run: |
          python3 scripts/commit_laravel_release.py --checkout "$GITHUB_WORKSPACE/laravel-distribution" --repository "$REPOSITORY" --mode distribution --message "Release v$VERSION from source $SOURCE" >> "$GITHUB_OUTPUT"
      - name: Publish distribution version
        env:
          GH_TOKEN: ${{ secrets.LARAVEL_DISTRIBUTION_TOKEN }}
          REPOSITORY: ${{ vars.LARAVEL_DISTRIBUTION_REPOSITORY }}
          COMMIT: ${{ steps.distribution-commit.outputs.commit-hash }}
          VERSION: ${{ needs.prepare-laravel-release.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$COMMIT"
          test "$(gh api "repos/$REPOSITORY/commits/$COMMIT" --jq '.commit.verification.verified')" = true
          gh release create "v$VERSION" --repo "$REPOSITORY" --target "$COMMIT" --title "v$VERSION" --notes-file "$RUNNER_TEMP/candidate/notes.md"
      - name: Publish independent source release and archive
        env:
          GH_TOKEN: ${{ secrets.LARAVEL_SOURCE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ steps.source-commit.outputs.commit-hash }}
          VERSION: ${{ needs.prepare-laravel-release.outputs.version }}
          DISTRIBUTION_REPOSITORY: ${{ vars.LARAVEL_DISTRIBUTION_REPOSITORY }}
          DISTRIBUTION_COMMIT: ${{ steps.distribution-commit.outputs.commit-hash }}
          ARCHIVE_SHA256: ${{ needs.prepare-laravel-release.outputs.archive-sha256 }}
        run: |
          set -euo pipefail
          printf '\nDistribution: %s@%s\nArchive SHA256: %s\n' "$DISTRIBUTION_REPOSITORY" "$DISTRIBUTION_COMMIT" "$ARCHIVE_SHA256" >> "$RUNNER_TEMP/candidate/notes.md"
          gh release create "laravel-v$VERSION" --latest=false --repo "$REPOSITORY" --target "$COMMIT" --title "Laravel v$VERSION" --notes-file "$RUNNER_TEMP/candidate/notes.md" "$RUNNER_TEMP/candidate/package.tar.gz" "$RUNNER_TEMP/candidate/candidate.json"
