name: "CI"

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "**.php"
      - "sdk_compliance_adapter/**"
      - "bin/posthog"
      - "composer.json"
      - "composer.lock"
      - "phpcs.xml"
      - "phpunit.xml"
      - "api/public-api.json"
      - "api/laravel-public-api.json"
      - "packages/laravel/composer.json"
      - "scripts/**"
      - ".github/workflows/php.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-markdown-only:
    uses: PostHog/.github/.github/workflows/detect-markdown-only.yml@ec25337d9fae0100622cbfea1bd5bd88284ac10b
    permissions:
      pull-requests: read

  composer-validate:
    needs: detect-markdown-only
    runs-on: ubuntu-latest
    steps:
      - name: Complete markdown-only PR check
        if: needs.detect-markdown-only.outputs.markdown_only == 'true'
        run: echo "Only Markdown files changed; no additional work is required for this check."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'

      - name: Set up PHP
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: 8.4
          tools: composer

      - name: Validate composer files
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        run: composer validate --no-check-version --strict

  public-api:
    needs: detect-markdown-only
    if: needs.detect-markdown-only.outputs.markdown_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: 8.4
          tools: composer

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check public API snapshot
        run: composer api:check

      - name: Install Laravel dependencies against the current SDK
        run: |
          composer --working-dir=packages/laravel config repositories.current-sdk path ../..
          composer install --working-dir=packages/laravel --prefer-dist --no-progress

      - name: Check Laravel public API snapshot
        run: composer api:check:laravel

      - name: Run Laravel tests
        run: composer --working-dir=packages/laravel test

  phpunit:
    needs: detect-markdown-only
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [8.2, 8.3, 8.4, 8.5]
    steps:
      - name: Complete markdown-only PR check
        if: needs.detect-markdown-only.outputs.markdown_only == 'true'
        run: echo "Only Markdown files changed; no additional work is required for this check."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'

      - name: Set up PHP ${{ matrix.php-version }}
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: zlib
          tools: composer, phpunit

      - name: Install Dependencies
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit Tests
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        run: ./vendor/bin/phpunit --bootstrap vendor/autoload.php --configuration phpunit.xml

      - name: Run adapter fidelity and report checker tests
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        run: python3 -m unittest discover -s sdk_compliance_adapter -v

  symfony-mailer:
    needs: detect-markdown-only
    if: needs.detect-markdown-only.outputs.markdown_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lock tests Symfony Mailer 7.4; these cover the oldest and newest supported lines.
          - php-version: "8.2"
            symfony: "6.4.*"
            stability: stable
          # The first 6.4 release: before 6.4.37, Symfony renames inline parts when it builds the body.
          # Composer blocks it for security advisories, which don't apply to a test run.
          - php-version: "8.2"
            symfony: "6.4.0"
            stability: stable
            allow-insecure: true
          # Symfony Mailer 8.2 adds remote templates; move to stable once 8.2.0 ships.
          - php-version: "8.4"
            symfony: "8.2.*"
            stability: beta
    name: symfony-mailer (${{ matrix.symfony }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: zlib
          tools: composer

      - name: Install Symfony ${{ matrix.symfony }}
        env:
          SYMFONY: ${{ matrix.symfony }}
          STABILITY: ${{ matrix.stability }}
          ALLOW_INSECURE: ${{ matrix.allow-insecure || 'false' }}
        run: |
          composer config minimum-stability "$STABILITY"
          if [ "$ALLOW_INSECURE" = "true" ]; then composer config policy.advisories.block false; fi
          composer config prefer-stable true
          composer require --dev --no-update "symfony/mailer:$SYMFONY" "symfony/mime:$SYMFONY" "symfony/framework-bundle:$SYMFONY" "symfony/http-client:$SYMFONY"
          composer update --with-all-dependencies --prefer-dist --no-progress

      # Apps that deploy with an authoritative classmap load only the classes Composer found.
      - name: Use an authoritative classmap
        run: composer dump-autoload --classmap-authoritative

      - name: Run the Symfony Mailer tests
        run: ./vendor/bin/phpunit --bootstrap vendor/autoload.php --configuration phpunit.xml --no-coverage test/Mailer

  coverage:
    runs-on: ubuntu-latest
    needs:
      - detect-markdown-only
      - phpunit
    if: needs.detect-markdown-only.outputs.markdown_only != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: 8.4
          extensions: xdebug, zlib
          tools: composer, phpunit

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit Coverage
        run: XDEBUG_MODE=coverage ./vendor/bin/phpunit --bootstrap vendor/autoload.php --configuration phpunit.xml --coverage-text

  phpcs:
    needs: detect-markdown-only
    runs-on: ubuntu-latest
    steps:
      - name: Complete markdown-only PR check
        if: needs.detect-markdown-only.outputs.markdown_only == 'true'
        run: echo "Only Markdown files changed; no additional work is required for this check."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        with:
          fetch-depth: 0 # important!

      - name: Set up PHP 8.4
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: 8.4
          tools: composer

      - name: Install Dependencies
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        run: composer install --prefer-dist --no-progress

      - name: Check PHP formatting
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        run: |
          ./vendor/bin/phpcbf --standard=phpcs.xml --no-colors --runtime-set ignore_non_auto_fixable_on_exit 1
          git diff --exit-code -- lib test

      - name: Check changed core PHP files
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          range="${BEFORE_SHA:-HEAD^}...HEAD"
          if [ -n "$BASE_REF" ]; then range="origin/$BASE_REF...HEAD"; fi
          git diff --name-only --diff-filter=ACM -z "$range" -- ':(glob)lib/**/*.php' ':(glob)test/**/*.php' |
            xargs -0 -r ./vendor/bin/phpcs --standard=phpcs.xml --extensions=php
