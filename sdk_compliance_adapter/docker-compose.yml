name: posthog-php-sdk-compliance

services:
  sdk-adapter:
    build:
      context: ..
      dockerfile: sdk_compliance_adapter/Dockerfile
    environment:
      POSTHOG_CONSUMER: ${POSTHOG_CONSUMER:-lib_curl}
    networks:
      - test-network

  test-harness:
    image: ghcr.io/posthog/sdk-test-harness:1.0.0
    command: ["run", "--adapter-url", "http://sdk-adapter:8080", "--mock-url", "http://test-harness:8081"]
    networks:
      - test-network
    depends_on:
      - sdk-adapter

networks:
  test-network:
    driver: bridge
